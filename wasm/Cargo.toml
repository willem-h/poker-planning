[package]
name = "poker-wasm"
version = "0.1.0"
edition = "2021"
description = "Peer-to-peer planning poker built on iroh"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["iroh-transport"]
# Rooms carried by iroh gossip over a relay.
iroh-transport = ["dep:iroh", "dep:iroh-gossip", "dep:n0-future", "dep:n0-error"]
# Rooms carried by whatever JS hands us — the WebRTC prototype.
webrtc-transport = []

[dependencies]
# Identity only: ed25519 keys and signatures, no transport. Both builds need it.
iroh-base = { version = "1.0", features = ["key"] }

iroh = { version = "1.0", default-features = false, features = ["tls-ring"], optional = true }
iroh-gossip = { version = "0.101", default-features = false, features = ["net"], optional = true }
n0-future = { version = "0.3", optional = true }
n0-error = { version = "1.0", optional = true }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
futures-channel = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
data-encoding = "2"
blake3 = "1"
rand = "0.10"
bytes = "1"
tracing = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
