name: Deploy to GitHub Pages

on:
  push:
    # Any branch may deploy, but the gate job below decides whether it should.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A repository has one Pages site, so deploys have to serialise. Runs queue
# rather than cancel, and the last one to finish is what is live.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  WASM_BINDGEN_VERSION: "0.2.127"

jobs:
  gate:
    # The default branch and branches with an open pull request deploy; anything
    # else would take the one Pages site over without anyone asking it to.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "dispatched by hand"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BRANCH" == "$DEFAULT_BRANCH" ]]; then
            echo "$BRANCH is the default branch"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
            --state open --json number --jq 'length')

          if [[ "$open" -gt 0 ]]; then
            echo "$BRANCH has $open open pull request(s)"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "$BRANCH has no open pull request; not deploying"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check room logic
        # Once per transport: the room is the same code, but each feature set
        # compiles a different half of the crate around it.
        run: |
          cargo test --manifest-path wasm/Cargo.toml --no-default-features --features iroh-transport
          cargo test --manifest-path wasm/Cargo.toml --no-default-features --features webrtc-transport

      - name: Install wasm-bindgen-cli
        # Must match the wasm-bindgen version resolved in wasm/Cargo.lock.
        run: cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build
        run: ./build.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Say what is live
        run: echo "::notice::Deployed ${{ github.ref_name }} to ${{ steps.deploy.outputs.page_url }}"
